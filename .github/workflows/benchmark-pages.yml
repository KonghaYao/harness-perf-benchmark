# 一趟跑完：装 harness → 生成剧本 → 跑整批 → 汇总出图表数据 → 发到 GitHub Pages。
#
# 触发与「这一趟跑不跑压测」（判定逻辑在下面的 decide 步骤里，只有一处）：
#   workflow_dispatch  手动。默认跑一批；可传 turns / repeats / runner / peri 版本，
#                      或勾 skip_bench 只把上一次的结果重新发布一遍。
#                      第一次调管道（或在 fork 上试）建议：turns=5 · repeats=1 · publish 取消勾选——
#                      装/跑/汇总/摘要都走一遍，但线上不动、结果也不进缓存。
#   schedule           每周一 03:00 UTC 跑一批，免得榜单停在上一次。
#   push 到 main       改动只落在 docs/ 时**不跑**压测——页面改动不该把榜单数字刷一遍，
#                      直接拿上一次的结果重发；动了 scripts/perf/、src/、playground/ 或本文件才重跑。
#
# 结果怎么留下来：数据是「现跑现生成」的，仓库里不存（data/ 已 gitignore）。每一趟跑完都把
# data/perf-chart.json 存进 Actions cache，只发布的那一趟取上一次的；缓存空的时候自动补跑一批。
#
# 口径提醒（这是发布用的站点，读的人会拿它当结论，所以别省这段）：
#   - 默认 runner 是 macOS：采样器的首选后端 proc_pid_rusage 只在 macOS 上可用。换 ubuntu 会
#     静默退到 ps（CPU 读数分辨率约 60ms、child_cpu_pct 恒为 0），CU 会偏低且页面上看不出异常；
#     真要换就显式传 runner=ubuntu-latest，并知道自己在读一份下界。runner 上跑出来的数字
#     与开发机不是一个批次——跨批次只比 CU，别比分数、别比绝对时长（见 docs/perf-compare.md）。
#   - 十六家串行、每家 repeats 次，图表取端到端时长居中的那一次（gen-chart-data --window）。
#   - opencode **v1** 已退出排名，这里不装、不跑；v2 是另一家（npm 包 `@opencode/cli`，bin 名
#     `opencode2`），在排名里，沙盒是 playground/opencode2。两者同名不同代，别混。
#   - peri 走 GitHub release。Antigravity CLI（agy）、Hermes Agent（hermes）、Kimi Code CLI
#     （kimi）与 Grok Build（grok）走各自的官方 install.sh（agy / hermes 装到 ~/.local/bin，
#     kimi 装到 ~/.kimi-code/bin，grok 装到 ~/.grok/bin）。ccode 没有安装包也没有 install.sh，
#     从 GitHub 取源码 `make ccode-cli` 装到 ~/bin。这几家都必须装成，装不上这一趟就整趟失败——
#     线上继续挂上一批的站点，
#     不会悄悄少一条曲线（十条曲线里少一条比整个榜单停更是更坏的失真）。

name: benchmark · gh-pages

on:
  workflow_dispatch:
    inputs:
      turns:
        description: 长剧本轮数（pi 自动 +33、agy 自动 +4、opencode2 与 grok 自动 +1、hermes 自动 +2、cline 自动 +⌈n/100⌉：它们的压缩/标题请求会多吃条目）
        default: "100"
      repeats:
        description: 每家跑几次（图表取端到端时长居中的那一次）
        default: "3"
      runner:
        description: 跑压测的 runner 标签
        default: macos-latest
      peri_version:
        description: peri 的 release tag（例 agent-v3.17.2；留空 = 最新）
        default: ""
      skip_bench:
        description: 跳过压测，只重新发布上一次的结果
        type: boolean
        default: false
      publish:
        description: 发布到 GitHub Pages（关掉就只跑一遍管道，线上不动、结果也不存）
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-pages.yml"
      - "scripts/perf/**"
      - "src/**"
      - "playground/**"
      - "docs/**"

# 发布 Pages 要的三个权限；contents 只读就够（本流程不写仓库）。
permissions:
  contents: read
  pages: write
  id-token: write

# 两趟叠在一起会互相抢端口、抢 data/runs，也会把读数搅浑：串行，不取消。
concurrency:
  group: benchmark-pages
  cancel-in-progress: false

jobs:
  bench-and-publish:
    # 整批 48 次运行（十六家 × 3），慢的机器上要几十分钟；给足上限，超了就是真卡住了。
    timeout-minutes: 150
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出（要拿 before..sha 的改动清单，取全量历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 钉住与本机一致的版本：各家 sandbox 的隔离（harnessEnv）依赖 Bun 1.4 起 `Bun.spawn`
      # 不再继承运行时对 process.env 赋值的这个行为，换版本要连着沙盒一起验。
      - name: 装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: 依赖
        run: bun install --frozen-lockfile

      - name: 单元测试与类型检查
        run: |
          bun test
          bun run typecheck

      # 只发布的那一趟靠它拿数据；跑压测的那一趟拿到的会被新结果覆盖。
      - name: 取上一次的结果
        uses: actions/cache/restore@v4
        with:
          path: data/perf-chart.json
          key: perf-chart-${{ github.run_id }}
          restore-keys: perf-chart-

      - name: 决定这一趟跑不跑压测
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SKIP: ${{ github.event.inputs.skip_bench || 'false' }}
          PUBLISH: ${{ github.event.inputs.publish || 'true' }}
          TURNS: ${{ github.event.inputs.turns || '100' }}
          REPEATS: ${{ github.event.inputs.repeats || '3' }}
          RUNNER: ${{ github.event.inputs.runner || 'macos-latest' }}
        run: |
          set -euo pipefail
          bench=1
          reason="手动触发"
          [ "${EVENT}" = "schedule" ] && reason="定时跑一批"
          if [ "${SKIP}" = "true" ]; then
            bench=0
            reason="勾了 skip_bench"
          fi
          if [ "${EVENT}" = "push" ] && [ "${bench}" = "1" ]; then
            # 只动了页面/文档就不重跑：判定看的是这次 push 的改动清单（全 0 的 before 表示新分支，按重跑处理）。
            changed=$(git diff --name-only "${BEFORE}" "${SHA}" 2>/dev/null || true)
            if [ -n "${changed}" ] && ! printf '%s\n' "${changed}" \
                | grep -qE '^(scripts/perf/|src/|playground/|\.github/workflows/)'; then
              bench=0
              reason="这次 push 只动了页面/文档，沿用上一次的结果"
            else
              reason="这次 push 动了压测相关代码"
            fi
          fi
          if [ "${bench}" = "0" ] && [ ! -f data/perf-chart.json ]; then
            bench=1
            reason="缓存里没有可用的图表数据，先补跑一批"
          fi
          # 管道自检：手动跑一趟小批次（turns=5 repeats=1）把 publish 关掉，
          # 装/跑/汇总/摘要都走一遍，但线上不动、结果也不进缓存。
          publish=true
          if [ "${PUBLISH}" = "false" ]; then publish=false; fi
          echo "bench=${bench}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          {
            echo "## harness-perf-benchmark"
            echo ""
            echo "- 这一趟：$([ "${bench}" = "1" ] && echo '跑一批压测' || echo '只重新发布')（${reason}）"
            echo "- 发布：$([ "${publish}" = "true" ] && echo '会发到 Pages' || echo '不发（publish 关掉了）')"
            echo "- 批次配置：轮数 ${TURNS} · 每家 ${REPEATS} 次 · runner \`${RUNNER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # 在 npm 全局安装之前固定 Node，避免切换版本后丢失全局 CLI 的 PATH。
      - name: 装 Node（ZCode 包内 CLI 实测版本）
        if: steps.decide.outputs.bench == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 26.9.0

      - name: 装 harness（peri + 九家 npm CLI + agy / hermes 官方脚本）
        if: steps.decide.outputs.bench == '1'
        env:
          PERI_INSTALL_VERSION: ${{ github.event.inputs.peri_version }}
          PERI_NO_PATH_HINT: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # peri 走官方安装脚本（从 GitHub release 取本平台的包，解到 $HOME/.peri）。
          # 不 curl | bash：先落盘再执行，出问题时日志里能看到脚本本身。
          # 它在「没装过旧版本」时不会去读 /dev/tty 提问，runner 每次都是干净的 HOME。
          curl -fsSL -o /tmp/peri-install.sh \
            https://raw.githubusercontent.com/konghayao/peri/main/scripts/install.sh
          # 它自己有个 bug（3.17.2 实测）：脚本结尾那句提示用的 BIN_LINK 只在「写 PATH 提示」
          # 那个分支里赋值，于是 PERI_NO_PATH_HINT=1 时 set -u 会以 unbound variable 收尾——
          # 而那时二进制与 $HOME/.peri/peri 软链早就装好了。所以不拿它的退出码当成败，
          # 改由下面自查：真有下载/解包问题，那两句会先失败。
          if ! bash /tmp/peri-install.sh; then
            echo "::warning::peri 安装脚本非 0 退出（已知上游 bug：PERI_NO_PATH_HINT=1 时结尾 BIN_LINK 未定义）；下面自查二进制，装不上就失败"
          fi
          "$HOME/.peri/peri" --version
          echo "${HOME}/.peri" >> "${GITHUB_PATH}"
          # 其余七家都在 npm 上。注意 `@opencode/cli` 是 opencode **v2**，它的 bin 里同时有
          # `opencode` 与 `opencode2` 两个名字；v1 已退出排名、这里不装，所以那个 `opencode`
          # 不会被谁用到（真要复测 v1，playground/opencode 的 demo 认版本号，不是 1.x 会直接报错）。
          npm i -g \
            @anthropic-ai/claude-code \
            @openai/codex \
            @earendil-works/pi-coding-agent \
            @github/copilot \
            @deepseek-ai/dsh \
            @minimax-ai/code \
            @opencode/cli \
            cline \
            @qwen-code/qwen-code

      # agy 只有官方一个安装脚本：它查一份平台清单（darwin_arm64 等）→ 下载约 180MB 的
      # 单文件二进制 → 校验 SHA-512 → 落到 ~/.local/bin/agy。脚本自己不改 PATH，所以下面
      # 补一句 GITHUB_PATH；**它没有钉版本的参数**（只认 --dir），CI 每次拿到的是当天的最新版，
      # 版本号只留在下一步的清单里，不进 run.json——那是全局约定（run.json 的 harness.version
      # 一律 null，不做 --version 探测），不是 agy 特殊，见 scripts/perf/run-meta.ts。
      # 顺带一提：`agy --version` 是有的（1.2.7 实测，只是没写进 --help），下面拿它自查。
      # 沙盒与本步无关：mock 端点、假 GEMINI_API_KEY、死代理都是 playground/antigravity/
      # perf-demo.ts 在起 harness 时注入的（deps.harnessEnv），这里只需要一个能跑的 agy。
      - name: 装 Antigravity CLI（agy：官方脚本装到 ~/.local/bin）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          # 与 peri 那步同一条纪律：先落盘再执行，脚本本身能进日志。
          curl -fsSL -o /tmp/agy-install.sh https://antigravity.google/cli/install.sh
          bash /tmp/agy-install.sh
          # 自查：脚本自己会校验 sha512，这里再确认二进制确实能跑（真倒在下载/校验上，这步失败）。
          "$HOME/.local/bin/agy" --version
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # Hermes Agent（Nous Research）也只有官方一个安装脚本：它拉仓库到 ~/.hermes/hermes-agent、
      # 建 Python venv（uv）、装 Node 侧依赖（node-pty 要现编，runner 上有 Xcode CLT 就够），
      # 最后把启动壳放到 ~/.local/bin/hermes。四个开关让它能无人值守跑完：跳过交互式 setup 与
      # 浏览器/Computer Use 两套可选组件（那两套对压测无用，装了只是拖时间）。与 agy 同类，
      # **没有钉版本的参数**，CI 每次拿当天最新版；版本号只留在下一步的清单里。
      # 沙盒与本步无关：HERMES_HOME、provider 配置、死代理都是 playground/hermes/perf-demo.ts
      # 在起 harness 时注入的（deps.harnessEnv），这里只需要一个能跑的 hermes。
      - name: 装 Hermes Agent（hermes：官方脚本装到 ~/.local/bin）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          # 与 peri / agy 那两步同一条纪律：先落盘再执行，脚本本身能进日志。
          curl -fsSL -o /tmp/hermes-install.sh https://hermes-agent.nousresearch.com/install.sh
          bash /tmp/hermes-install.sh --skip-setup --skip-browser --skip-computer-use --non-interactive
          # 自查：装完确认壳能跑（真倒在下载/建 venv/装依赖上，这步会先失败）。
          "$HOME/.local/bin/hermes" --version
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # ZCode 没有官方 npm CLI：从官方桌面安装包取出 glm/zcode.cjs，不启动 Electron。
      # 固定 3.14.1（CLI 0.16.9），它使用的 provider_config schema 已在本机验证。
      - name: 装 ZCode（官方安装包内的 headless CLI）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "不支持的 ZCode 架构" >&2; exit 1 ;;
          esac
          install_dir="${RUNNER_TEMP}/zcode"
          mkdir -p "${install_dir}"
          # URL 取自官网 https://zcode.z.ai/en 的平台下载清单，不用第三方同名 npm 包。
          base="https://cdn-zcode.z.ai/zcode/electron/releases/3.14.1"
          case "$(uname -s)" in
            Darwin)
              curl -fSL --retry 3 -o "${install_dir}/ZCode.dmg" \
                "${base}/macos-${arch}/ZCode-3.14.1-mac-${arch}.dmg"
              mount="${install_dir}/mount"
              hdiutil attach "${install_dir}/ZCode.dmg" -readonly -nobrowse -mountpoint "${mount}"
              trap 'hdiutil detach "${mount}"' EXIT
              resources="${install_dir}/Resources"
              ditto "${mount}/ZCode.app/Contents/Resources" "${resources}"
              hdiutil detach "${mount}"
              trap - EXIT
              ;;
            Linux)
              curl -fSL --retry 3 -o "${install_dir}/ZCode.deb" \
                "${base}/linux-${arch}/ZCode-3.14.1-linux-${arch}.deb"
              dpkg-deb -x "${install_dir}/ZCode.deb" "${install_dir}/unpacked"
              entry=$(find "${install_dir}/unpacked" -type f -path '*/resources/glm/zcode.cjs')
              test -n "${entry}" && test -f "${entry}"
              resources="$(dirname "$(dirname "${entry}")")"
              ;;
            *) echo "ZCode 压测只支持 macOS / Linux runner" >&2; exit 1 ;;
          esac
          test -f "${resources}/config/provider/zcode-builtin.json"
          HOME="${install_dir}" node "${resources}/glm/zcode.cjs" --version
          echo "ZCODE_RESOURCES=${resources}" >> "${GITHUB_ENV}"

      # Kimi Code CLI（kimi，Moonshot）也只有官方一个安装脚本：落 ~/.kimi-code/bin/kimi
      # （单文件原生二进制，macOS arm64 实测 2.0.0）。**钉 2.0.0**：沙盒的 config.toml
      # （providers / models 两张表）与「无标题、无压缩」的消费规律都是按 2.0.0 实测的，
      # 上游大版本翻新时先在本机复测再动这个钉子。脚本自己会改 shell profile，runner 上
      # 用 KIMI_NO_MODIFY_PATH=1 关掉，PATH 由下面的 GITHUB_PATH 补。
      # 沙盒与本步无关：KIMI_CODE_HOME、provider 配置、遥测/更新/定时任务开关都是
      # playground/kimi/perf-demo.ts 在起 harness 时注入的（deps.harnessEnv），
      # 这里只需要一个能跑的 kimi。
      - name: 装 Kimi Code CLI（官方 install.sh，装到 ~/.kimi-code）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          # 与 peri / agy / hermes 那几步同一条纪律：先落盘再执行，脚本本身能进日志。
          curl -fsSL -o /tmp/kimi-install.sh https://code.kimi.com/kimi-code/install.sh
          KIMI_NO_MODIFY_PATH=1 KIMI_VERSION=2.0.0 bash /tmp/kimi-install.sh
          # 自查：装完确认二进制确实能跑（真倒在下载/解包上，这步失败）。
          "$HOME/.kimi-code/bin/kimi" --version
          echo "${HOME}/.kimi-code/bin" >> "${GITHUB_PATH}"

      # ccode（MoyaMryia/ccode，纯 C89 + POSIX）：没有 npm 包、也没有 install.sh，只有源码——
      # `make ccode-cli` 出一个自带 TLS 的静态二进制（部署机器不需要任何系统库）。装到 ~/bin 再进
      # GITHUB_PATH；沙盒（CCODE_SESSION_DIR、provider 环境变量）由 playground/ccode/perf-demo.ts
      # 在起 harness 时注入，这里只需要一个能跑的 ccode-cli。
      - name: 装 ccode（源码构建 ccode-cli）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/bin"
          git clone --depth 1 https://github.com/MoyaMryia/ccode.git /tmp/ccode
          make -C /tmp/ccode ccode-cli
          cp /tmp/ccode/ccode-cli "${HOME}/bin/ccode-cli"
          # 自查：装完确认二进制确实能跑（真倒在编译上，这步失败）。
          "${HOME}/bin/ccode-cli" --help >/dev/null
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      # Grok Build（grok，xAI）：官方 install.sh 把单文件二进制落到 ~/.grok/bin/grok。
      # 第一个参数钉版本（与本机实测的 1.0.41 对齐）；不传则是当天 stable。
      # 沙盒（GROK_HOME、config.toml、假 api_key）由 playground/grok/perf-demo.ts 在起
      # harness 时注入，这里只需要一个能跑的 grok。安装脚本会改 runner 的 shell rc，
      # 那是一次性 HOME，不影响宿主。
      - name: 装 Grok Build（官方 install.sh，装到 ~/.grok/bin）
        if: steps.decide.outputs.bench == '1'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/grok-install.sh https://x.ai/cli/install.sh
          bash /tmp/grok-install.sh 1.0.41
          "$HOME/.grok/bin/grok" --version
          echo "${HOME}/.grok/bin" >> "${GITHUB_PATH}"

      - name: 报一下装到了什么版本
        if: steps.decide.outputs.bench == '1'
        run: |
          for bin in peri agy claude codex pi copilot dsh mcode opencode2 hermes cline kimi qwen ccode-cli grok; do
            printf '%-8s %s\n' "${bin}" "$(command -v "${bin}" || echo '（不在 PATH 里）')"
          done
          peri --version || true
          agy --version || true
          claude --version || true
          codex --version || true
          pi --version || true
          copilot --version || true
          dsh --version || true
          mcode --version || true
          # v2 的版本号自己带名字（实测 `opencode v2.0.10`），打印出来正好当「装的是 v2 不是 v1」
          # 的现场证据——v1 只输出一个裸的 `1.17.12`。
          opencode2 --version || true
          hermes --version || true
          cline --version || true
          kimi --version || true
          qwen --version || true
          ccode-cli --help | head -1 || true
          grok --version || true

      - name: 生成剧本（按各家工具形状）
        if: steps.decide.outputs.bench == '1'
        env:
          TURNS: ${{ github.event.inputs.turns || '100' }}
        run: |
          set -euo pipefail
          gen() { bun run scripts/perf/gen-long-run.ts "$@"; }
          # peri / claude-code 共用 Bash + command 形状的那份；其余各家参数不一样，见 CLAUDE.md。
          gen --turns "${TURNS}" --out data/scenarios/long-run.json
          # ZCode 3.14.1：Bash + command，100 轮实测 101 请求，无辅助请求插队。
          gen --turns "${TURNS}" --out data/scenarios/long-run-zcode.json
          gen --turns "${TURNS}" --args exec --out data/scenarios/long-run-codex.json
          # pi 从约 140 条消息起自动压缩，压缩期每轮多一条 messages=2 的总结请求：
          # 100 轮实测要 135 条（--turns 133），131 条只有 99 轮。
          gen --turns "$((TURNS + 33))" --tool bash --out data/scenarios/long-run-pi.json
          # Copilot CLI：bash + {command}；标准 100×4KB 剧本会插入上下文摘要请求，
          # 但仍执行返回的工具调用，100 条工具条目正好跑满 100 轮，无需额外补条目。
          gen --turns "${TURNS}" --tool bash --out data/scenarios/long-run-copilot.json
          gen --turns "${TURNS}" --tool bash --args command+description \
            --out data/scenarios/long-run-dsh.json
          gen --turns "${TURNS}" --tool bash --out data/scenarios/long-run-minimax-code.json
          # agy：shell 工具是 run_command、五项大驼峰参数都必填；它还有两笔自己的开销——
          # 序列**第一条**是会话标题生成，另有一条「每约 32 个请求一次」的上下文压缩摘要。
          # 实测 100 轮要 104 条（104 = 100 轮 + 标题 1 + 压缩 3），故 +4。
          gen --turns "$((TURNS + 4))" --args commandline \
            --out data/scenarios/long-run-antigravity.json
          # opencode2：shell 工具改名叫 shell（v1 的 bash 没了）、参数只要 {command}；它开局先发
          # 一条会话标题生成请求（比主流程还早），同样吃条目，所以 +1（100 轮实测 102 条请求
          # = 标题 1 + 工具轮 100 + 收尾 1）。它不像 pi 那样压缩、也没有 peri 的预测请求。
          gen --turns "$((TURNS + 1))" --tool shell \
            --out data/scenarios/long-run-opencode2.json
          # hermes：shell 工具叫 terminal、参数 {command}；它有两笔自己的开销，都要留出条目——
          # 会话标题生成（stream=false、无 tools；与主请求几乎同时发出、谁先不定）与途中一次
          # 上下文压缩（约 170 条消息时那条 "You are a summarization agent creating a context
          # checkpoint."，压完历史剩 21 条、紧接着一条重述主请求，前后两条都取号）。
          # 实测 100 轮要 102 轮剧本（104 条 = 102 + 2 条收尾），故 +2。
          gen --turns "$((TURNS + 2))" --tool terminal \
            --out data/scenarios/long-run-hermes.json
          # cline：shell 工具叫 run_commands、参数是**字符串数组** {commands: [...]}（唯一的数组
          # 形状）。它的**上下文压缩会吃掉一条剧本**——默认 --compaction agentic，长到阈值时把
          # 当轮换成一条 "Summarize this session for continuation…" 请求（messages=2），响应被当
          # 摘要用掉、当轮的工具调用不再执行。实测标准剧本（每轮 4KB）每约 90 轮触发一次：
          # --turns 101（103 条）实测 102 条请求 = 1 条初始 + 99 条带工具结果的续跑 + 1 条压缩 +
          # 1 条压缩后续跑 = **100 个工具轮**；200 轮实测压缩 2 次。所以按「每 100 轮 +1、
          # 向上取整」留条目。
          gen --turns "$((TURNS + (TURNS + 99) / 100))" --args commands \
            --out data/scenarios/long-run-cline.json
          # Kimi Code CLI（kimi）：Bash + command，与 peri / Claude Code 同形；100 轮实测
          # 101 条请求（1 条初始 + 100 个工具轮 + 1 条收尾），没有标题生成、没有上下文压缩、
          # 没有预测请求，所以轮数不用加（与 mcode 同一档）。
          gen --turns "${TURNS}" --out data/scenarios/long-run-kimi.json
          # Qwen Code（qwen）：run_shell_command + {command}；100 轮实测 101 条请求
          # （1 条初始 + 100 个工具轮 + 1 条收尾），没有标题生成、上下文压缩或预测请求。
          gen --turns "${TURNS}" --tool run_shell_command \
            --out data/scenarios/long-run-qwen-code.json
          # ccode：bash + command，与 pi / mcode 同形；撞上自己的 --max-turns 就停，
          # 所以剧本给 TURNS 条即可（不加轮数）。
          gen --turns "${TURNS}" --tool bash --out data/scenarios/long-run-ccode.json
          # Grok Build（grok）：模型侧工具是 run_terminal_command + {command, description}。
          # 开局一条 session_title 请求吃掉一条，100×4KB 在 context_window=1000000 下不压缩，故 +1。
          gen --turns "$((TURNS + 1))" --tool run_terminal_command --args command+description \
            --out data/scenarios/long-run-grok.json

      - name: 跑批次（十六家串行，每家 repeats 次）
        if: steps.decide.outputs.bench == '1'
        env:
          REPEATS: ${{ github.event.inputs.repeats || '3' }}
        run: |
          set -euo pipefail
          label="ci-$(date -u +%Y%m%d-%H%M)"
          echo "批次标签：${label}（写进每次运行的 run.json，便于按批筛）"
          # 一次没跑成（harness 崩了 / 端口被占）就再试一次：gen-chart-data 按「最近 window 次」
          # 取中位，补上一条能让它落回正常的 3 条里。
          run_one() {
            local dir="playground/$1" attempt
            for attempt in 1 2; do
              if (cd "${dir}" && bun perf-demo.ts --timeout-ms 240000 --label "${label}"); then
                return 0
              fi
              echo "::warning::$1 第 ${attempt} 次运行非 0 退出"
            done
            echo "::warning::$1 这一轮两次都没跑成，图表会少一条读数"
            return 0
          }
          for round in $(seq 1 "${REPEATS}"); do
            for harness in peri claude-code codex pi copilot deepseek minimax-code antigravity opencode2 hermes cline zcode kimi qwen-code ccode grok; do
              echo "::group::第 ${round} 轮 · ${harness}"
              run_one "${harness}"
              echo "::endgroup::"
            done
          done
          ls -R data/runs | head -40

      - name: 汇总出图表数据
        if: steps.decide.outputs.bench == '1'
        env:
          REPEATS: ${{ github.event.inputs.repeats || '3' }}
        run: |
          set -euo pipefail
          bun run scripts/perf/gen-chart-data.ts \
            --dir data/runs --window "${REPEATS}" --out data/perf-chart.json

      - name: 存下这一份结果（下次只发布时复用）
        if: steps.decide.outputs.bench == '1' && steps.decide.outputs.publish == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/perf-chart.json
          key: perf-chart-${{ github.run_id }}

      - name: 结果摘要
        run: |
          set -euo pipefail
          # 采样后端自检：rusage 不可用时 run.ts 会静默退到 ps，读数会偏低而页面看不出来。
          # 「只发布」那一趟没有 data/runs（直接沿用缓存里的结果），这里的 grep 必须容得下空目录，
          # 否则 set -e + pipefail 会把整步判失败。
          degraded=$( { grep -rl '"backend": "ps"' data/runs/*/*/run.json 2>/dev/null || true; } \
            | wc -l | tr -d ' ')
          echo "退到 ps 后端的运行次数：${degraded}"
          [ "${degraded}" = "0" ] || echo "::warning::有 ${degraded} 次运行退到了 ps 采样后端，这一批的 CU 是下界"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("data/perf-chart.json", "utf8"));
            const rows = data.runs.filter((run) => run.score).sort((a, b) => a.score.cu - b.score.cu);
            const num = (value, digits) => (value === undefined ? "n/a" : value.toFixed(digits));
            const lines = [
              "",
              `数据生成于 ${data.generatedAt} · 产物 ${data.sourceDir}`,
              "",
              "| harness | CU | 分数 | 峰值 CPU % | 峰值 RSS MB |",
              "| --- | --- | --- | --- | --- |",
              ...rows.map((run) => {
                const peaks = run.score.peaks ?? {};
                return `| ${run.name} | ${run.score.cu.toFixed(3)} | ${num(run.score.score, 1)} | ${num(peaks.treeCpuPercent, 1)} | ${num(peaks.treeRssMb, 1)} |`;
              }),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: 组装站点（页面在根，数据在 data/）
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/logos
          # 页面跑到站点根当首页，logos/ 与 vendor/ 都按页面的相对路径摆在根上；
          # 数据放 _site/data/：页面取数先试 data/（站点布局），再试 ../data/（仓库布局）。
          cp docs/perf-chart.html _site/index.html
          cp -R docs/logos/. _site/logos/
          cp data/perf-chart.json _site/data/perf-chart.json
          # Chart.js 的本地兜底也带上：页面先试 unpkg（2s 超时），拿不到才用 vendor/。
          # 取不到不算失败——那只是少了一层兜底，页面照旧走 CDN。
          if curl -fsSL --max-time 20 -o _site/chart.tmp \
              https://unpkg.com/chart.js@4/dist/chart.umd.min.js; then
            mkdir -p _site/vendor
            mv _site/chart.tmp _site/vendor/chart.umd.min.js
          else
            rm -f _site/chart.tmp
            echo "::warning::没能取到 Chart.js 的本地兜底，页面将只依赖 CDN"
          fi
          find _site -type f | sort

      - name: 配置 Pages
        if: steps.decide.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: 上传站点
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        if: steps.decide.outputs.publish == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
