# grok 沙盒配置（GROK_HOME 指向本目录时生效，不碰 ~/.grok）
# provider 指向 llm-mock：base_url 由 perf-demo.ts 每次启动按本次端口重写，
# api_backend 三种都支持（chat_completions / responses / messages），我们只用得上第一种。

[model.llm-mock]
model = "llm-mock"
base_url = "http://127.0.0.1:3457/v1"
name = "llm-mock"
api_key = "mock-key"
api_backend = "chat_completions"
context_window = 128000

[models]
default = "llm-mock"
